AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CLCS 660 predictive maintenance alert-only prototype (synthetic data first).

Parameters:
  NotificationEmail:
    Type: String
    Description: Email address to subscribe to the SNS topic; confirm the subscription after deployment.
  ScheduleExpression:
    Type: String
    Default: rate(15 minutes)
    Description: Scheduled invocation rate. Use a conservative rate for the course demo.
  RiskThreshold:
    Type: Number
    Default: 0.65
    MinValue: 0.1
    MaxValue: 0.99
    Description: Document and validate the chosen threshold using held-out data.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 20
    MemorySize: 256
    Tracing: Active

Resources:
  TelemetryKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encryption key for CLCS 660 predictive maintenance data
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: 'kms:*'
            Resource: '*'
          # The account-root statement enables IAM policies in this account to
          # authorize key use. The Lambda role receives narrowly scoped KMS actions below.

  TelemetryBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt TelemetryKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireProjectObjects
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: alias/aws/sns

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref AlertTopic

  PredictiveMaintenanceFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PredictiveMaintenanceLeastPrivilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
              - Sid: ReadInputAndWritePredictions
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub '${TelemetryBucket.Arn}/latest_metrics.json'
                  - !Sub '${TelemetryBucket.Arn}/predictions/*'
              - Sid: ListBucketForDiagnostics
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt TelemetryBucket.Arn
              - Sid: UseTelemetryKey
                Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !GetAtt TelemetryKey.Arn
              - Sid: PublishPredictiveAlerts
                Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref AlertTopic

  PredictiveMaintenanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: function/
      Handler: src.lambda_function.handler
      Role: !GetAtt PredictiveMaintenanceFunctionRole.Arn
      Environment:
        Variables:
          DATA_BUCKET: !Ref TelemetryBucket
          INPUT_KEY: latest_metrics.json
          ALERT_TOPIC_ARN: !Ref AlertTopic
          KMS_KEY_ARN: !GetAtt TelemetryKey.Arn
          RISK_THRESHOLD: !Ref RiskThreshold
      Events:
        ScheduledCheck:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Enabled: true

  FunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Alert if predictive maintenance Lambda errors repeatedly
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PredictiveMaintenanceFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ConfigRecorderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWS_ConfigRole

  ConfigDeliveryBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ConfigDeliveryBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ConfigDeliveryBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowConfigBucketAclCheck
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt ConfigDeliveryBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowConfigDeliverConfigurationHistory
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${ConfigDeliveryBucket.Arn}/AWSLogs/${AWS::AccountId}/Config/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                AWS:SourceAccount: !Ref AWS::AccountId

  ConfigRecorder:
    Type: AWS::Config::ConfigurationRecorder
    Properties:
      Name: clcs660-recorder
      RoleARN: !GetAtt ConfigRecorderRole.Arn
      RecordingGroup:
        AllSupported: true
        IncludeGlobalResourceTypes: true

  ConfigDeliveryChannel:
    Type: AWS::Config::DeliveryChannel
    DependsOn: ConfigRecorder
    Properties:
      Name: clcs660-delivery-channel
      S3BucketName: !Ref ConfigDeliveryBucket

  S3PublicReadProhibited:
    Type: AWS::Config::ConfigRule
    DependsOn: ConfigDeliveryChannel
    Properties:
      ConfigRuleName: clcs660-s3-public-read-prohibited
      Source:
        Owner: AWS
        SourceIdentifier: S3_BUCKET_PUBLIC_READ_PROHIBITED

  S3PublicWriteProhibited:
    Type: AWS::Config::ConfigRule
    DependsOn: ConfigDeliveryChannel
    Properties:
      ConfigRuleName: clcs660-s3-public-write-prohibited
      Source:
        Owner: AWS
        SourceIdentifier: S3_BUCKET_PUBLIC_WRITE_PROHIBITED

Outputs:
  InputBucketName:
    Description: Upload synthetic latest_metrics.json to this bucket
    Value: !Ref TelemetryBucket
  AlertTopicArn:
    Description: SNS topic ARN for elevated-risk notifications
    Value: !Ref AlertTopic
  LambdaFunctionName:
    Description: Scheduled predictive maintenance function
    Value: !Ref PredictiveMaintenanceFunction
  KmsKeyArn:
    Description: Customer-managed encryption key ARN
    Value: !GetAtt TelemetryKey.Arn
